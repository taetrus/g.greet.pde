# Common ProGuard flags shared by every bundle obfuscation.
# Bundle-specific -keep rules are NOT here: they are generated per bundle from
# the bundle's own metadata (MANIFEST.MF Export-Package / Bundle-Activator +
# OSGI-INF DS descriptors) by ObfuscationRunner into target/keep/<bundle>.pro.
# The -injars/-outjars/-libraryjars/-printmapping args are also supplied by the
# runner so paths never appear in a config file (keeps this Windows-safe).

# --- Output bytecode level: keep it at Java 1.8 (class file v52) -------------
-target 1.8

# --- Scope of this demo: name obfuscation only -------------------------------
# No optimization or shrinking, so the ONLY transformation is renaming. That
# isolates the lesson: what survives renaming in an OSGi/DS runtime, and what does not.
-dontoptimize
-dontshrink

# Keep the metadata OSGi/DS needs to read at runtime. Signature/Exceptions are
# included for bundles that export API packages with generics or throws clauses.
-keepattributes *Annotation*,RuntimeVisibleAnnotations,RuntimeVisibleParameterAnnotations,InnerClasses,EnclosingMethod,Signature,Exceptions

-dontnote
-dontwarn
