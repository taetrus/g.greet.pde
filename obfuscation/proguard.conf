# ProGuard configuration for the com.kk.greet.imp OSGi bundle.
# Flags + keep-rules only; the -injars/-outjars/-libraryjars are supplied by the
# Maven plugin (see obfuscation/pom.xml) so paths stay resolvable via Maven props.

# --- Output bytecode level: keep it at Java 1.8 (class file v52) -------------
-target 1.8

# --- Scope of this demo: name obfuscation only -------------------------------
# No optimization or shrinking, so the ONLY transformation is renaming. That
# isolates the lesson: what survives renaming in an OSGi/DS runtime, and what does not.
-dontoptimize
-dontshrink

# Keep the metadata OSGi/DS needs to read at runtime.
-keepattributes *Annotation*,RuntimeVisibleAnnotations,RuntimeVisibleParameterAnnotations,InnerClasses,EnclosingMethod

# --- The OSGi/DS contract that MUST NOT be renamed ---------------------------
# OSGI-INF/com.kk.greet.imp.Greet.xml hard-codes this class by fully-qualified
# name, activates it via start(), and the component provides IGreet (greet()).
# Rename any of these and SCR fails to load/activate/bind the component.
-keep class com.kk.greet.imp.Greet {
    void start();
    public void greet();
}

# Everything else in the bundle (e.g. the package-private MessageFormatter helper)
# is fair game and WILL be renamed.

-dontnote
-dontwarn
